# Static export: `next build` writes HTML/CSS/JS to out/.
[build]
  command = "npm run build"
  publish = "out"

# Same security headers as public/_headers / vercel.json.
# 'unsafe-inline' is required for Next.js bootstrap scripts and Tailwind/Next
# inline styles. Static hosts cannot mint per-request CSP nonces.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
